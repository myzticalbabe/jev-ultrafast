name: flightfp

on:
  push:
    paths:
      - "flightfp/**"
      - "jev_ultrafast/flight_fp.py"
      - "scripts/record_flights.py"
      - "scripts/measure_flights.py"
      - ".github/workflows/flightfp.yml"
  pull_request:
    paths:
      - "flightfp/**"
      - "jev_ultrafast/flight_fp.py"
      - "scripts/record_flights.py"
      - "scripts/measure_flights.py"
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flightfp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/flightfp .
